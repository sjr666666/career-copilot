# JVM 时区：默认容器 UTC 会导致 LocalDateTime 落库为 UTC 时刻，
# 前端再按本地时区解析会出现 8 小时偏差。
# 此设置会被 Gradle 传递给 fork 的 JVM（包括 bootRun 的应用进程）。
org.gradle.jvmargs=-Duser.timezone=Asia/Shanghai -Xms256m -Xmx512m -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Duser.country=CN -Duser.language=zh